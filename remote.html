<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TKJ Remote Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #011a13; 
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .active-btn:active { 
            transform: scale(0.92); 
            filter: brightness(1.2);
        }
        .glass-panel {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.1);
            backdrop-filter: blur(10px);
        }
        /* Styling untuk video scanner agar rapi */
        #reader video {
            border-radius: 0.75rem !important;
            object-fit: cover !important;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white p-6 overflow-hidden">
    
    <div id="status-container" class="text-center mb-6">
        <div id="status-dot" class="w-3 h-3 bg-red-500 rounded-full mx-auto mb-2 animate-pulse"></div>
        <p id="status-text" class="text-[10px] font-black uppercase tracking-[0.3em] text-red-500">Mencoba Menghubungkan...</p>
    </div>

    <div class="glass-panel p-6 rounded-[3rem] w-full max-w-xs flex flex-col items-center shadow-2xl transition-all duration-300">
        
        <div id="scanner-panel" class="w-full flex flex-col items-center gap-4 hidden">
            <h2 class="text-[11px] font-black text-emerald-400 uppercase tracking-widest text-center">Scan QR PC</h2>
            <div class="p-2 bg-white/10 rounded-2xl shadow-inner w-full border border-white/20">
                <div id="reader" class="w-full rounded-xl overflow-hidden"></div>
            </div>
            <p class="text-[9px] text-white/50 text-center uppercase tracking-wider animate-pulse">Arahkan kamera ke barcode di layar utama</p>
        </div>

        <div id="capture-panel" class="w-full flex flex-col items-center gap-8 hidden">
            <div class="relative">
                <div id="ring" class="absolute inset-0 border-4 border-emerald-500 rounded-full scale-125 opacity-20 transition-all"></div>
                <button id="btn-shoot" disabled class="relative w-32 h-32 bg-emerald-500 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(16,185,129,0.4)] active-btn disabled:grayscale disabled:opacity-50 transition-all">
                    <span class="text-4xl">📸</span>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-4 w-full">
                <button id="btn-switch" class="flex flex-col items-center justify-center p-4 bg-white/5 rounded-[2rem] border border-white/10 active-btn disabled:opacity-50 transition-all">
                    <span class="text-2xl mb-1">🔄</span>
                    <span class="text-[9px] font-bold uppercase tracking-widest">Kamera</span>
                </button>

                <button id="btn-mirror" class="flex flex-col items-center justify-center p-4 bg-white/5 rounded-[2rem] border border-white/10 active-btn disabled:opacity-50 transition-all">
                    <span class="text-2xl mb-1">🪞</span>
                    <span class="text-[9px] font-bold uppercase tracking-widest">Mirror</span>
                </button>
            </div>
        </div>

        <div id="edit-panel" class="w-full flex flex-col items-center gap-3 hidden">
            <h2 class="text-[10px] font-black text-emerald-400 uppercase tracking-[0.2em] mb-1">Mode Edit (PC Aktif)</h2>
            <div class="grid grid-cols-2 gap-3 w-full">
                <button id="btn-next-session" class="col-span-2 py-4 bg-yellow-600 rounded-[1.5rem] font-black text-white text-[11px] uppercase shadow-lg active-btn flex items-center justify-center gap-2">
                    <span>📸</span> Lanjut Foto
                </button>
                <button id="btn-print1" class="py-3 bg-purple-600 rounded-xl font-black text-white text-[10px] uppercase shadow-lg active-btn">📄 Cetak 1</button>
                <button id="btn-print4" class="py-3 bg-indigo-600 rounded-xl font-black text-white text-[10px] uppercase shadow-lg active-btn">田 Cetak 4</button>
                
                <button id="btn-download" class="col-span-2 py-4 bg-teal-600 rounded-[1.5rem] font-black text-white text-[11px] uppercase shadow-lg active-btn flex items-center justify-center gap-2">
                    ⬇️ Simpan ke HP
                </button>

                <button id="btn-drive" class="col-span-2 py-4 bg-blue-600 rounded-[1.5rem] font-black text-white text-[11px] uppercase shadow-lg active-btn flex items-center justify-center gap-2">☁️ Kirim ke Drive</button>
                <button id="btn-reset" class="col-span-2 py-3 bg-red-600/80 border border-red-500 rounded-xl font-black text-white text-[10px] uppercase shadow-lg active-btn mt-2">Selesai / Reset</button>
            </div>
        </div>

    </div>

    <p class="mt-12 text-[8px] font-medium text-emerald-500/40 uppercase tracking-[0.4em] text-center">
        TKJ Photobooth Remote System v3.0
    </p>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const remoteId = urlParams.get('remoteId');
        
        const statusContainer = document.getElementById('status-container');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        
        const scannerPanel = document.getElementById('scanner-panel');
        const capturePanel = document.getElementById('capture-panel');
        const editPanel = document.getElementById('edit-panel');
        
        const btnShoot = document.getElementById('btn-shoot');
        const ring = document.getElementById('ring');
        const btnDownload = document.getElementById('btn-download');
        
        let wakeLock = null;
        let html5QrCode = null;
        let peer = null;

        // --- FUNGSI MENCEGAH LAYAR MATI ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
            } catch (err) {}
        }

        // --- FUNGSI MEMULAI SCANNER ---
        function startScanner() {
            // Sembunyikan semua panel lain
            statusContainer.classList.add('hidden');
            capturePanel.classList.add('hidden');
            editPanel.classList.add('hidden');
            
            // Tampilkan Scanner
            scannerPanel.classList.remove('hidden');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            html5QrCode.start(
                { facingMode: "environment" }, // Kamera belakang
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    // Cek apakah hasil scan mengandung "remoteId="
                    if (decodedText.includes('remoteId=')) {
                        html5QrCode.stop().then(() => {
                            vibrate(100);
                            // Arahkan browser ke URL yang di-scan
                            window.location.href = decodedText;
                        }).catch(err => console.log(err));
                    }
                },
                (errorMessage) => { /* Abaikan error pembacaan per frame */ }
            ).catch((err) => {
                alert("Harap izinkan akses kamera agar HP bisa memindai QR Code.");
            });
        }

        // --- LOGIKA UTAMA ---
        if (remoteId) {
            // Jika masuk dengan Remote ID, mulai koneksi PeerJS
            capturePanel.classList.remove('hidden');
            peer = new Peer();
            
            peer.on('open', () => {
                const conn = peer.connect(remoteId);
                
                conn.on('open', () => {
                    statusText.innerText = "TERHUBUNG KE PC";
                    statusText.className = "text-[10px] font-black uppercase tracking-[0.3em] text-emerald-500";
                    statusDot.className = "w-3 h-3 bg-emerald-500 rounded-full mx-auto mb-2";
                    btnShoot.disabled = false;
                    ring.classList.add('animate-ping');
                    
                    requestWakeLock();

                    btnShoot.onclick = () => { conn.send('SHOT'); vibrate(50); };
                    document.getElementById('btn-switch').onclick = () => { conn.send('SWITCH_CAM'); vibrate(30); };
                    document.getElementById('btn-mirror').onclick = () => { conn.send('TOGGLE_MIRROR'); vibrate(30); };

                    document.getElementById('btn-next-session').onclick = () => { conn.send('NEXT_SESSION'); vibrate(40); };
                    document.getElementById('btn-print1').onclick = () => { conn.send('PRINT_1'); vibrate(40); };
                    document.getElementById('btn-print4').onclick = () => { conn.send('PRINT_4'); vibrate(40); };
                    document.getElementById('btn-drive').onclick = () => { conn.send('DRIVE_UPLOAD'); vibrate(50); };
                    
                    btnDownload.onclick = () => { 
                        conn.send('DOWNLOAD_TO_PHONE'); 
                        vibrate(50); 
                        btnDownload.innerText = "⏳ Memproses...";
                        btnDownload.disabled = true;
                    };

                    // SAAT KLIK SELESAI / RESET
                    document.getElementById('btn-reset').onclick = () => { 
                        conn.send('RESET'); 
                        vibrate([50, 100, 50]); 
                        
                        // 1. Putuskan koneksi
                        if(peer) peer.destroy();
                        
                        // 2. Bersihkan URL dari ?remoteId= agar tidak mengulang
                        window.history.replaceState({}, document.title, window.location.pathname);
                        
                        // 3. Nyalakan mode pemindai
                        startScanner();
                    };
                });

                conn.on('data', (data) => {
                    if (typeof data === 'object') {
                        if (data.type === 'STATE_CHANGE') {
                            if (data.state === 'state-edit') {
                                capturePanel.classList.add('hidden');
                                editPanel.classList.remove('hidden');
                            } else {
                                capturePanel.classList.remove('hidden');
                                editPanel.classList.add('hidden');
                            }
                        } 
                        else if (data.type === 'DOWNLOAD_DATA') {
                            const a = document.createElement('a');
                            a.href = data.image;
                            a.download = `TKJ_Booth_Remote_${Date.now()}.png`;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            
                            btnDownload.innerHTML = "⬇️ Simpan ke HP";
                            btnDownload.disabled = false;
                            vibrate([50, 50, 50]);
                        }
                    }
                });

                conn.on('close', () => {
                    statusText.innerText = "KONEKSI TERPUTUS";
                    statusText.className = "text-[10px] font-black uppercase tracking-[0.3em] text-red-500";
                    btnShoot.disabled = true;
                    statusDot.className = "w-3 h-3 bg-red-500 rounded-full mx-auto mb-2 animate-pulse";
                    ring.classList.remove('animate-ping');
                    if (wakeLock !== null) { wakeLock.release(); wakeLock = null; }
                });
            });
        } else {
            // Jika buka remote.html tanpa URL khusus, langsung jadikan HP sebagai Scanner!
            startScanner();
        }

        function vibrate(ms) { if (navigator.vibrate) { navigator.vibrate(ms); } }
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
